<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Babu Angi flame">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .outer {
        animation: flame-sway 2.8s ease-in-out infinite;
        transform-origin: 32px 40px;
      }
      .inner {
        animation: ember-breathe 1.85s ease-in-out infinite;
        transform-origin: 32px 44px;
      }
      .trace {
        animation: outline-trace 2.55s ease-in-out infinite;
      }
    }
    @keyframes flame-sway {
      0%, 100% { transform: rotate(-.8deg) scaleX(1) translateY(0); }
      38% { transform: rotate(1.1deg) scaleX(.985) translateY(-.35px); }
      72% { transform: rotate(-.6deg) scaleX(1.01) translateY(.2px); }
    }
    @keyframes ember-breathe {
      0%, 100% { opacity: .78; transform: scale(1); }
      45% { opacity: 1; transform: scale(1.035); }
      72% { opacity: .86; transform: scale(.99); }
    }
    @keyframes outline-trace {
      0%, 100% { stroke-dashoffset: 116; opacity: .12; }
      48% { stroke-dashoffset: 42; opacity: .72; }
      96% { stroke-dashoffset: -20; opacity: .12; }
    }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 .96 0 1 0 0 .48 0 0 1 0 .08 0 0 0 .62 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="outer-stroke" x1="18" y1="8" x2="47" y2="57">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="ember" x1="27" y1="18" x2="38" y2="50">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="52%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#020617"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="12" fill="none" stroke="#f8fafc" stroke-opacity=".2"/>
  <g class="outer">
    <path d="M33.8 5.5C40.7 14.3 42 21.2 38 29.4c4-2.2 6.4-5.9 7.1-10.6 7 8.1 9.6 16 7.7 23.5C50.4 52 42 59.5 31.5 59.5 20 59.5 11.6 51.2 11.6 40.8c0-7.8 4.5-13.3 9.2-18.8 4.5-5.3 8.9-10.6 8.9-18.1 1.5.4 2.9.9 4.1 1.6Z" fill="#020617" stroke="url(#outer-stroke)" stroke-width="3.8" stroke-linejoin="round"/>
    <path class="trace" d="M33.8 5.5C40.7 14.3 42 21.2 38 29.4c4-2.2 6.4-5.9 7.1-10.6 7 8.1 9.6 16 7.7 23.5C50.4 52 42 59.5 31.5 59.5 20 59.5 11.6 51.2 11.6 40.8c0-7.8 4.5-13.3 9.2-18.8 4.5-5.3 8.9-10.6 8.9-18.1 1.5.4 2.9.9 4.1 1.6Z" fill="none" stroke="#fbbf24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 118" filter="url(#glow)"/>
    <path class="inner" d="M32 18.5c3.8 5.4 3.9 10.1 1.7 14.3 2.9-1.1 5.3-3 6.9-5.8 3 4.8 3.8 9.4 2.4 13.8-1.7 5.4-6.1 9.4-11.8 9.4-6.3 0-10.6-4.8-10.6-10.7 0-4.6 2.7-7.9 5.4-11.3 2.8-3.4 5.5-6.8 5.1-11.8.3.1.6.3.9.5Z" fill="none" stroke="url(#ember)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>
